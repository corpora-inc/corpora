pdf-engine: xelatex
from: markdown
to: pdf
variables:
  documentclass: memoir
  classoption:
    - oneside
    - 11pt
  papersize: {{ paperwidth|default:"6in" }},{{ paperheight|default:"9in" }}
include-in-header:
  - custom_headings.tex
include-before-body:
  - custom_cover.tex
toc: true
toc-depth: 2
